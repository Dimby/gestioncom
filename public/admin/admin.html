<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Gestion Commerciale</title>
  <link rel="stylesheet" href="/assets/css/assets.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link rel="stylesheet" href="/assets/css/uiv2.css">
  <link rel="stylesheet" href="/assets/select2/css/select2.min.css">
</head>
<body>
  <div class="root-v2">
    <nav id="nav-v2"></nav>
  
    <div class="main-content">
      <div class="root" style="display: flex;">
        <div class="container" style="flex: 1;">
          <h2>Ajouter un nouveau produit</h2>
        
          <form id="stockForm">
            <input type="text" id="brandName" placeholder="Nom de l'article (ex: Stylo BIC)" required>
  
            <select id="genericName" required style="width:100%; margin-bottom: 10px;">
                <option value="">Sélectionner une catégorie</option>
                <option value="envelope">ENV (Enveloppe)</option>
                <option value="folder">DOS (Chemise)</option>
                <option value="office_paper">PAP (Papier bureau)</option>
                <option value="special_paper">BRISTOL (Papier bristol)</option>
                <option value="photo_paper">PHOTO (Papier photo)</option>
                <option value="colored_office_paper">COLOR (Papier couleur)</option>
                <option value="plastic_sleeve">POCH (Pochette)</option>
                <option value="spiral_binding">SPI (Spirales)</option>
                <option value="book_cover_film">COUV (Couverture livre)</option>
                <option value="lamination_film">PLAST (Plastification)</option>
                <option value="staple">AGRA (Agrafe)</option>
                <option value="notepad">BLOCNOTE (Bloc-note)</option>
                <option value="supplies">FOURNITURE SCOLAIRE</option>
            </select>
            
            <input type="number" id="prix" placeholder="Prix d'achat" required min="0">
            <input type="number" id="salePrice" placeholder="Prix de vente" required min="0">
            <input type="number" id="stock" placeholder="Stock à ajouter" required min="1">
            <button type="submit">Ajouter au stock</button>
          </form>
        </div>
    
      </div>
    
      <!-- <section class="import-section">
        <h2>Importer une base de données</h2>
        <form id="importForm">
            <input type="file" id="dbFile" accept=".json" required>
            <button type="submit">Importer</button>
        </form>
      </section> -->
    </div>
  </div>

  <script src="/assets/js/nav-active.js"></script>
  <script src="/assets/select2/js/jquery.js"></script>
  <script src="/assets/select2/js/select2.min.js"></script>
  <script type="module" src="/assets/js/admin/admin.js"></script>
  <script src="/assets/js/admin/nav.js"></script>

<script>
  $(document).ready(function() {
      $('#produits').select2({
          placeholder: "Sélectionner un produit"
      });
  });
</script>
</body>
</html>
