<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Trésorerie - Gestion Commerciale</title>
  <link rel="stylesheet" href="/assets/css/assets.css">
  <link rel="stylesheet" href="/assets/css/uiv2.css">
  <link rel="stylesheet" href="/assets/css/treasury.css">
</head>
<body>
  <div class="root-v2">
    <nav id="nav-v2"></nav>

    <div class="main-content" style="justify-content: flex-start; gap: 20px">
      <div class="titre">
        <h1 id="treasuryDateTitle">Trésorerie</h1>
        <div class="actions">
          <div class="month-navigation">
            <button id="prevMonth" class="month-nav-btn">&lt;</button>
            <span id="currentMonthDisplay"></span>
            <button id="nextMonth" class="month-nav-btn">&gt;</button>
          </div>
          <div class="recap-filter" style="display:flex; align-items:center; margin-left:20px;">
            <label class="switch">
              <input type="checkbox" id="excludePCommandeSwitch">
              <span class="slider round"></span>
            </label>
            <span style="margin-left:10px;">Exclure P.Commande</span>
          </div>
        </div>
      </div>
      
      <div class="container">
        <!-- Vue calendrier mensuel -->
        <div id="calendarView">
          <!-- Bandeau KPI : totaux du mois affiché -->
          <div class="treasury-kpis">
            <div class="treasury-kpi">
              <span class="treasury-kpi-label">Report (fin mois précédent)</span>
              <span class="treasury-kpi-value" id="kpiReport">0 Ar</span>
            </div>
            <div class="treasury-kpi">
              <span class="treasury-kpi-label">Recettes du mois</span>
              <span class="treasury-kpi-value" id="kpiRecettes">0 Ar</span>
            </div>
            <div class="treasury-kpi">
              <span class="treasury-kpi-label">Dépenses du mois</span>
              <span class="treasury-kpi-value" id="kpiDepenses">0 Ar</span>
            </div>
            <div class="treasury-kpi p-commande-column">
              <span class="treasury-kpi-label">P.Commande du mois</span>
              <span class="treasury-kpi-value" id="kpiPCommande">0 Ar</span>
            </div>
            <div class="treasury-kpi">
              <span class="treasury-kpi-label">Marge brute du mois</span>
              <span class="treasury-kpi-value" id="kpiMargin">0 Ar</span>
            </div>
          </div>
          <div class="treasury-calendar" id="treasuryCalendar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/nav-active.js"></script>
  <script src="/assets/js/admin/nav.js"></script>
  <script src="/assets/js/admin/treasury.js"></script>
</body>
</html>
